name: Check signals

on:
  schedule:
    # 3x on Bursa trading days: 09:15, 12:30, 16:45 MYT (UTC+8) = 01:15, 04:30, 08:45 UTC
    - cron: "15 1 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "45 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run signal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
        run: node scripts/check-signals.mjs

      - name: Commit updated signal state
        run: |
          git config user.name "signalvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last-signals.json
          git diff --cached --quiet || git commit -m "chore: update signal state [skip ci]"
          git push
